<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Музей Саши</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3a1216">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Музей Саши">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"Lora";src:url("fonts/Lora-Variable.ttf") format("truetype");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Lora";src:url("fonts/Lora-Italic-Variable.ttf") format("truetype");font-weight:400 700;font-style:italic;font-display:swap}
:root{--wall:#5c1e24;--wall2:#4a161b;--gold:#d9b35e;--hi:#f3d98f;--lo:#8a6224;--paper:#f6eedb;--ink:#2b1a10;--muted:#6b5440;--ok:#2f7a45;--bad:#b3412e;--warn:#b5641c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Lora",Georgia,serif;color:var(--paper);background:repeating-linear-gradient(90deg,#5c1e24 0 44px,#621f26 44px 88px);font-size:18px}
button,input{font:inherit}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 20px;background:linear-gradient(#3a1216,#2c0d10);border-bottom:5px solid var(--gold);box-shadow:0 3px 0 var(--lo),0 8px 18px rgba(0,0,0,.4)}
.logo{font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hi);font-size:clamp(19px,2.2vw,28px);cursor:pointer}
.logo small{display:block;font-size:.48em;letter-spacing:.1em;color:var(--gold);font-style:italic;text-transform:none;font-weight:400}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid var(--gold);color:var(--hi);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:16px}
nav button[aria-current="page"]{background:var(--paper);color:var(--wall);font-weight:700}
.sync{margin-left:auto;font-size:13px;color:var(--gold);font-style:italic}
main{max-width:1100px;margin:0 auto;padding:22px 18px 80px}
.btn{cursor:pointer;border-radius:10px;padding:10px 18px;background:linear-gradient(var(--hi),var(--gold));color:#3a1a06;border:1px solid var(--lo);font-weight:700;box-shadow:0 2px 0 var(--lo)}
.btn.big{font-size:clamp(20px,2.4vw,26px);padding:16px 30px}
.btn.ghost{background:transparent;color:var(--wall);border-color:var(--wall);box-shadow:none}
.btn.small{font-size:15px;padding:6px 12px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.panel{background:var(--paper);color:var(--ink);border:5px solid var(--gold);border-radius:14px;box-shadow:0 0 0 2px var(--lo),0 14px 36px rgba(0,0,0,.45);padding:22px 26px;margin-bottom:20px}
.panel h2{margin:0 0 6px;color:var(--wall);font-size:clamp(22px,2.6vw,30px)}
.panel h3{margin:14px 0 6px;color:var(--wall)}
.muted{color:var(--muted)}
.hero-row{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.hero-row .grow{flex:1 1 320px}
.count{font-size:15px;color:var(--muted)}
.halls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.hall{background:var(--paper);color:var(--ink);border:4px solid var(--gold);border-radius:12px;padding:14px 16px;box-shadow:0 8px 18px rgba(0,0,0,.35);cursor:pointer;text-align:left;position:relative}
.hall.locked{opacity:.62;cursor:default;filter:saturate(.6)}
.hall .ic{font-size:30px}
.hall b{display:block;font-size:20px;margin:2px 0}
.hall .sub{font-size:14px;color:var(--muted)}
.bar{height:12px;border-radius:6px;background:#e4d6b4;overflow:hidden;margin-top:10px;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;background:var(--c)}
.qcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:2px dashed var(--gold);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fffaf0}
.qcard .grow{flex:1 1 260px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#efe2c2;color:var(--muted);margin-right:6px;font-family:system-ui,sans-serif}
.tag.la{background:#dfeaf7;color:#2c4f7c}.tag.app{background:#f3e0d8;color:#8a3d22}.tag.web{background:#e3efe0;color:#3c6b33}
/* review */
.stage{max-width:820px;margin:0 auto}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:#7d3a40;border:2px solid var(--gold)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.cur{background:var(--hi)}
.qbox{text-align:center}
.qbox .kind{font-size:14px;color:var(--muted);letter-spacing:.05em}
.qbox .prompt{font-size:clamp(20px,2.4vw,26px);margin:10px 0 6px;line-height:1.35}
.qbox .big{font-size:clamp(28px,3.6vw,40px);font-weight:700;color:var(--wall);margin:8px 0}
.qbox pre{font-family:inherit;font-style:italic;font-size:clamp(18px,2vw,22px);white-space:pre-wrap;margin:8px auto;display:inline-block;text-align:left;background:#fffaf0;border-left:4px solid var(--gold);padding:8px 16px}
.qbox img{max-width:100%;max-height:300px;border:4px solid var(--gold);background:#fff;margin:6px 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}
.opt{cursor:pointer;background:#fffaf0;border:3px solid var(--gold);border-radius:12px;padding:14px 16px;font-size:clamp(17px,1.9vw,21px);color:var(--ink);text-align:left;line-height:1.3}
.opt:hover:not(:disabled){background:#fff2cf}
.opt.right{background:#dff1e2;border-color:var(--ok)}.opt.wrong{background:#f6dcd6;border-color:var(--bad)}
.typed{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.typed input{font-size:24px;padding:10px 14px;border-radius:10px;border:3px solid var(--gold);min-width:min(420px,90vw);background:#fffdf6}
.fb{margin-top:16px;padding:14px 18px;border-radius:12px;text-align:left;font-size:clamp(17px,1.8vw,20px);line-height:1.45}
.fb.ok{background:#e4f3e6;border:2px solid var(--ok)}.fb.bad{background:#f9e3de;border:2px solid var(--bad)}
.fb b{display:block;font-size:1.1em;margin-bottom:4px}
.moves{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.mv{background:#fffaf0;border:2px solid var(--gold);border-radius:10px;padding:6px 10px;font-size:15px}
/* rating overlay */
.ov{position:fixed;inset:0;background:rgba(30,8,10,.84);display:flex;align-items:center;justify-content:center;z-index:20;padding:18px}
.ov .panel{max-width:820px;width:100%;max-height:92vh;overflow:auto}
.rates{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.rates button{flex:1 1 180px;font-size:20px;padding:14px;border-radius:12px;cursor:pointer;border:3px solid var(--gold);background:#fffaf0;color:var(--ink)}
.rates button[aria-pressed="true"]{background:var(--wall);color:var(--paper);border-color:var(--wall)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{cursor:pointer;border-radius:20px;border:2px solid var(--gold);background:#fffaf0;padding:6px 12px;font-size:15px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--bad);color:#fff;border-color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #e2d2ad;vertical-align:top}
th{color:var(--muted);font-weight:600}
.spark{display:flex;align-items:flex-end;gap:3px;height:70px;margin:8px 0}
.spark i{flex:1;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.spark i.z{background:#e4d6b4}
.kpis{display:flex;gap:14px;flex-wrap:wrap}
.kpi{flex:1 1 150px;background:#fffaf0;border:2px solid var(--gold);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:26px;color:var(--wall)}
.book{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e8dcc0;flex-wrap:wrap}
.book .seg{display:flex;gap:4px}
.book .seg button{font-size:13px;padding:4px 9px;border-radius:14px;border:1px solid var(--gold);background:#fffaf0;cursor:pointer;color:var(--ink)}
.book .seg button[aria-pressed="true"]{background:var(--wall);color:#fff;border-color:var(--wall)}
.flag{color:var(--warn);font-weight:700}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);border:3px solid var(--gold);border-radius:10px;padding:10px 16px;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.4)}
@media (max-width:640px){body{font-size:17px}header{padding:6px 10px}.panel{padding:16px}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo" role="button" tabindex="0">Музей Саши<small>подготовка к 610 · до экзамена <span id="days"></span></small></div>
  <nav aria-label="Разделы">
    <button data-v="home" aria-current="page">Музей</button>
    <button data-v="halls">Залы</button>
    <button data-v="read">Читальный зал</button>
    <button data-v="cur">Куратору</button>
  </nav>
  <div class="sync" id="sync">загрузка…</div>
</header>
<main id="main"></main>
<script src="catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
